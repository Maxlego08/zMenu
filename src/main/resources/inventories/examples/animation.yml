# ╔════════════════════════════════════════════════════════════════╗
# ║                  INVENTORY-ANIMATION PROPERTIES                ║
# ╚════════════════════════════════════════════════════════════════╝
#
# The `open-animation` section reveals the items one after the other when the
# inventory opens, instead of displaying everything at once.
#
# It only changes what the player sees: buttons are built normally, so their
# clicks, requirements and refresh tasks all keep working.

name: "&8Animation"
size: 27

open-animation:
  # Order in which the slots are revealed. Available types:
  #   SEQUENTIAL       left to right, row by row (also named ROWS)
  #   COLUMNS          top to bottom, column by column
  #   HORIZONTAL_SNAKE row by row, alternating the direction of each row
  #   VERTICAL_SNAKE   column by column, alternating the direction of each column
  #   SPIRAL           from the outside towards the middle, clockwise
  #   FROM_CENTER      from the middle outwards
  #   WAVE             a diagonal sweep, from the top left to the bottom right
  #   CHECKERBOARD     one slot out of two, then the gaps
  #   MATRIX           the order you draw yourself, see below
  #   CUSTOM           the order you list yourself, see below
  #   RANDOM           in a random order
  #
  # With MATRIX, each character of each line is a slot and every distinct
  # character is a step, played in character order. A space leaves a slot
  # out, and anything the drawing does not cover is revealed last:
  #
  #   type: MATRIX
  #   matrix:
  #     - "111111111"
  #     - "122222221"
  #     - "111111111"
  #
  # With CUSTOM you list the slots instead of drawing them. Each line is a
  # single slot or a range, like the slots of a button, and anything you
  # leave out is revealed last:
  #
  #   type: CUSTOM
  #   order:
  #     - 13
  #     - 12
  #     - 14
  #     - 3-5
  type: HORIZONTAL_SNAKE

  # Plays the order backwards. FROM_CENTER becomes a reveal towards the
  # middle, SEQUENTIAL starts at the bottom right, and so on.
  reverse: false

  # When the animation plays. ALWAYS (default) plays on every open, ONCE only
  # plays the first time the player opens this menu until they reconnect.
  # Refreshing the menu, for instance by changing page, never replays it.
  play: ALWAYS

  interval: 40          # Milliseconds between two steps.
  slots-per-step: 1     # How many slots are revealed on each step. Use 9 to reveal a full row at a time.
  freeze: true          # Ignore clicks while the animation plays. Recommended, see the note below.

# With `freeze: false` a player can click a button before it appears, because
# the button already exists behind the scenes. Only turn it off for menus where
# clicking early is harmless.

items:

  border:
    type: NONE
    slots:
      - 0-8
      - 18-26
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  diamond:
    type: NONE
    slot: 13
    item:
      material: DIAMOND
      name: "&bRevealed last"
      lore:
        - "&7Try the other animation types"
