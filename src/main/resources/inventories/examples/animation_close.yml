# ╔════════════════════════════════════════════════════════════════╗
# ║                   INVENTORY-CLOSE-ANIMATION                    ║
# ╚════════════════════════════════════════════════════════════════╝
#
# `close-animation` takes the buttons away instead of putting them there.
# It is the reverse of `animation`, and takes all the same options.
#
# It plays for a close the MENU decides on:
#   - a `close` action
#   - a `back` action
#   - an `inventory` action switching to another menu
#
# It does NOT play when the player presses escape. Nothing can hold a
# window open once the client has closed it, and a menu that came back for
# a moment after you dismissed it would look broken rather than nice.
#
# Press escape on this menu and it vanishes at once. Click the barrier and
# it unwinds first. That difference is the whole feature.

name: "&8Closing animation"
size: 27

open-animation:
  type: SPIRAL
  interval: 25
  sound:
    sound: BLOCK_NOTE_BLOCK_HAT
    pitch: [ 1.4, 1.9 ]

close-animation:
  type: SPIRAL
  interval: 20
  # Unwinds the way it came in, rather than starting again from the outside.
  reverse: true
  sound:
    sound: BLOCK_NOTE_BLOCK_HAT
    pitch: [ 0.7, 1.1 ]

items:

  border:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18-26
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  close:
    type: NONE
    slot: 13
    item:
      material: BARRIER
      name: "&cClose"
      lore:
        - "&7Click to close this menu."
        - ""
        - "&7The menu unwinds before it goes,"
        - "&7because closing is something it"
        - "&7decided to do."
        - ""
        - "&8Press escape instead and it just"
        - "&8vanishes: that one is not ours to"
        - "&8hold open."
    actions:
      - type: close

  # A switch to another menu waits for the closing animation too, so the
  # next one only opens once this one has gone.
  go:
    type: NONE
    slot: 11
    item:
      material: ENDER_PEARL
      name: "&bOpen another menu"
      lore:
        - "&7This menu unwinds, then the next"
        - "&7one opens with its own animation."
    actions:
      - type: inventory
        inventory: animation

  plain:
    type: NONE
    slot: 15
    item:
      material: BOOK
      name: "&fNothing special"
      lore:
        - "&7Just a button, to show the menu"
        - "&7works normally throughout."
