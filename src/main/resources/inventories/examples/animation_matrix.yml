# ╔════════════════════════════════════════════════════════════════╗
# ║                  INVENTORY-MATRIX-ANIMATION                    ║
# ╚════════════════════════════════════════════════════════════════╝
#
# `type: MATRIX` lets you draw the reveal order instead of picking one of
# the built in ones.
#
# Each line of the matrix is a row of the inventory and each character a
# slot. Every distinct character is a step, and the steps play in the
# order the characters sort in, so 1 comes before 2, and digits come
# before letters.
#
# This menu opens as three rings closing in on the middle.

name: "&8Matrix animation"
size: 54

open-animation:
  type: MATRIX
  interval: 90
  freeze: true

  matrix:
    - "111111111"
    - "122222221"
    - "123333321"
    - "123333321"
    - "122222221"
    - "111111111"

  sound:
    sound: BLOCK_NOTE_BLOCK_BASS
    pitch: 1.4
    volume: 0.5

items:

  outer:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
      - 36
      - 44
      - 45-53
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  middle:
    type: NONE
    slots:
      - 10-16
      - 19
      - 25
      - 28
      - 34
      - 37-43
    item:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: " "

  inner:
    type: NONE
    slots:
      - 20
      - 21
      - 23
      - 24
      - 29-33
    item:
      material: WHITE_STAINED_GLASS_PANE
      name: " "

  # Not part of the drawing: a slot the matrix leaves out is revealed
  # last. Here every slot is covered, so this one follows the ring it
  # sits in like everything else.
  center:
    type: NONE
    slot: 22
    item:
      material: NETHER_STAR
      name: "&eDrawn with a matrix"
      lore:
        - "&7The order comes from the `matrix` block"
        - "&7at the top of this file."
