# ╔════════════════════════════════════════════════════════════════╗
# ║                  INVENTORY-CUSTOM-ANIMATION                    ║
# ╚════════════════════════════════════════════════════════════════╝
#
# `type: CUSTOM` lets you list the reveal order slot by slot, instead of
# drawing it like MATRIX does. A shape is easier to draw; a precise
# sequence is easier to list.
#
# Each line is a single slot or a range, exactly like the `slots` of a
# button. Anything you leave out is revealed last, in ascending order,
# so you only have to list the slots you actually care about.
#
# This menu deals the five middle items outwards from the centre, then
# fills in the frame.

name: "&8Custom animation"
size: 27

open-animation:
  type: CUSTOM
  interval: 120
  freeze: true

  order:
    - 13        # centre first
    - 12        # then out to the left
    - 14        # and to the right
    - 11
    - 15
    - 0-8       # the top row of the frame
    - 18-26     # then the bottom one

  sound:
    sound: BLOCK_NOTE_BLOCK_PLING
    pitch: 1.2
    volume: 0.6

items:

  frame:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18-26
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  cards:
    type: NONE
    slots:
      - 11
      - 12
      - 14
      - 15
    item:
      material: PAPER
      name: "&fDealt outwards"

  centre:
    type: NONE
    slot: 13
    item:
      material: GOLD_INGOT
      name: "&6Dealt first"
      lore:
        - "&7The order comes from the `order` block"
        - "&7at the top of this file."

  # Slots 10 and 16 are in no line of the order, so they are revealed
  # last, after everything that was listed.
  leftovers:
    type: NONE
    slots:
      - 10
      - 16
    item:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7Revealed last"
