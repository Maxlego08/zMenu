#
# Documentation: https://docs.groupez.dev/zmenu/getting-started
# Online editor: https://minecraft-inventory-builder.com/
#
# Get 23.5% off at MineStrator with: https://cashback.groupez.dev/

# ╔════════════════════════════════════════════════════════════════╗
# ║              INVENTORY-ADVANCED-ANIMATION PROPERTIES           ║
# ╚════════════════════════════════════════════════════════════════╝
#
# `inventories/examples/animation.yml` shows the one line version: pick a type
# and the whole inventory is revealed with it.
#
# This file shows the rest: splitting the inventory into groups that play one
# after the other, giving each group its own style, and letting a single button
# arrive late or not be animated at all.
#
# Reading order of this menu:
#   1. the border spirals in, quickly
#   2. a redstone block flashes over the content while it is revealed
#   3. the content grows out of the middle, slower
#   4. the highlighted item lands last
#   5. a countdown at the top counts down and rings when group 2 starts
#   6. the close button was there the whole time

name: "&8Advanced animation"
size: 54

open-animation:
  # This whole block could live in `animations/` and be used by name:
  #
  #   open-animation:
  #     file: fancy_open
  #     interval: 10     # anything written here overrides the shared file
  #
  # See `animations/fancy_open.yml`, which is this animation without the
  # temporary items.

  # These are the defaults. Any group that does not override them uses these.
  type: SPIRAL
  interval: 25
  slots-per-step: 1
  freeze: true

  # Played every time a slot is revealed. At most one sound is played per
  # instant, so revealing several slots at once is not heard as noise.
  # A group, or a single button, may override it.
  sound:
    sound: BLOCK_NOTE_BLOCK_HAT
    pitch: 1.8
    volume: 0.4

  # Run when the animation starts, once it is known that it will play, and
  # when it is over however it ended: finished, taken over by another
  # animation, or the menu being closed.
  start-actions:
    - type: sound
      sound: BLOCK_CHEST_OPEN
      pitch: 1.4
      volume: 0.5
  end-actions:
    - type: sound
      sound: BLOCK_NOTE_BLOCK_CHIME
      pitch: 1.6
      volume: 0.4

  # Per group overrides. Groups play in ascending order: group 2 only starts
  # once every slot of group 1 has been revealed.
  groups:
    2:
      type: FROM_CENTER
      interval: 60
      delay: 150       # extra pause between the end of group 1 and the start of group 2
      sound:
        sound: BLOCK_NOTE_BLOCK_HARP
        pitch: 1.2
        volume: 0.5

  # ─────────────────────────────────────────────────────────────────
  # TEMPORARY ITEMS
  # These exist only while the animation plays. They are not buttons:
  # no click, no requirement, and they are gone once it is over.
  #
  # `show` and `hide` accept:
  #   250              250 milliseconds after the animation started
  #   group:2          the moment group 2 starts
  #   group:2.start    the same thing, written explicitly
  #   group:2.end      the moment group 2 is over
  #   start / end      the beginning / the end of the animation
  #
  # The end of a group is not the start of the next one: the next group
  # may not exist, and if it has a `delay` there is a gap between them.
  #
  # The same time may also be written as a section:
  #   show:
  #     group: 2
  #     at: end        # start by default
  # Both forms mean exactly the same thing, pick whichever reads better.
  #
  # A temporary item hides the button under it for as long as it is
  # shown. When it goes away the slot goes back to the real item, or
  # stays empty if no button owns it.
  # ─────────────────────────────────────────────────────────────────
  items:

    # A redstone block flashes over the content area while group 2 is
    # revealed, then disappears. It never exists in the finished menu.
    flash:
      slots:
        - 20
        - 21
        - 23
        - 24
      show: group:2
      hide: group:2.end
      item:
        material: REDSTONE_BLOCK
        name: "&c"

    # Nothing owns slot 13, so this one draws on an empty part of the
    # menu and leaves it empty again.
    # Written with the section form, which says the same thing as
    # `show: 200` / `hide: 600` would.
    spark:
      slot: 13
      show:
        at: 200
      hide:
        at: 600
      item:
        material: GLOWSTONE
        name: "&e"

    # `show` and `hide` are a shorthand for two frames. Writing the
    # frames out lets the item change while it is displayed, and lets
    # each moment play its own sound.
    #
    # Every frame needs `at`, then either an `item` or `remove: true`.
    countdown:
      slot: 11
      frames:
        one:
          at: start
          item:
            material: RED_STAINED_GLASS_PANE
            name: "&c3"
          sound:
            sound: BLOCK_NOTE_BLOCK_HAT
            pitch: 0.8
        two:
          at: 250
          item:
            material: ORANGE_STAINED_GLASS_PANE
            name: "&62"
          sound:
            sound: BLOCK_NOTE_BLOCK_HAT
            pitch: 1.0
        three:
          at: 500
          item:
            material: LIME_STAINED_GLASS_PANE
            name: "&a1"
          sound:
            sound: BLOCK_NOTE_BLOCK_HAT
            pitch: 1.2
        gone:
          at: group:2
          remove: true
          sound:
            sound: BLOCK_NOTE_BLOCK_BELL

items:

  # ─────────────────────────────────────────────────────────────────
  # GROUP 1 — the frame, revealed first
  # A button only picks its group; how the group is revealed is decided
  # above, so a single animation can span several buttons.
  # ─────────────────────────────────────────────────────────────────
  border:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
      - 36
      - 44
      - 45-48
      - 50-53
    animation:
      group: 1
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  # ─────────────────────────────────────────────────────────────────
  # GROUP 2 — the content, revealed once the frame is done
  # ─────────────────────────────────────────────────────────────────
  content:
    type: NONE
    slots:
      - 20
      - 21
      - 23
      - 24
      - 29-33
    animation:
      group: 2
      # Buttons refuse to be covered by a temporary item unless they say
      # otherwise, so the `flash` above may draw over this one.
      allow-temporary-items: true
    item:
      material: LIME_STAINED_GLASS_PANE
      name: "&aContent"

  # A delay only shifts the slots of this button, inside its own group.
  # The next group still waits for it, so nothing ever overlaps.
  highlight:
    type: NONE
    slot: 22
    animation:
      group: 2
      delay: 400
    item:
      material: NETHER_STAR
      name: "&eArrives last"
      lore:
        - "&7This button has a delay of 400ms"

  # ─────────────────────────────────────────────────────────────────
  # NOT ANIMATED
  # `animation: false` displays the button immediately, even while the
  # rest of the inventory is still being revealed. Handy for a close
  # button, or for anything a player should be able to see straight away.
  #
  # Note that with `freeze: true` the button is visible but not yet
  # clickable: clicks are ignored until the animation is over.
  # ─────────────────────────────────────────────────────────────────
  close:
    type: NONE
    slot: 49
    animation: false
    item:
      material: BARRIER
      name: "&cClose"
    close-inventory: true
