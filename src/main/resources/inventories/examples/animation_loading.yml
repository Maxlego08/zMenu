# ╔════════════════════════════════════════════════════════════════╗
# ║                 INVENTORY-LOADING-ANIMATION                    ║
# ╚════════════════════════════════════════════════════════════════╝
#
# An empty slot waiting to be revealed reads as a hole. A temporary item
# covering it reads as something loading.
#
# Here the content area is filled with gray panes while the border draws
# itself, and the panes turn orange just before they go away and the real
# items appear underneath.
#
# The temporary items are not buttons: they cannot be clicked, they have
# no requirement, and they do not exist once the animation is over.

name: "&8Loading animation"
size: 27

open-animation:
  type: HORIZONTAL_SNAKE
  interval: 30
  freeze: true

  groups:
    2:
      type: FROM_CENTER
      interval: 70
      delay: 100

  temporary-items:

    # Covers the content area for the whole of group 1, then hands the
    # slots back. Because a button owns each of them, they go back to the
    # real item rather than being left empty.
    loading:
      slots:
        - 11-15
      frames:
        waiting:
          at: start
          item:
            material: GRAY_STAINED_GLASS_PANE
            name: "&8Loading..."
        nearly:
          at: group:1.end
          item:
            material: ORANGE_STAINED_GLASS_PANE
            name: "&6Almost there..."
          sound:
            sound: BLOCK_NOTE_BLOCK_HAT
            pitch: 1.6
        done:
          at: group:2
          remove: true
          sound:
            sound: BLOCK_NOTE_BLOCK_BELL
            pitch: 1.4

items:

  border:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18-26
    animation:
      group: 1
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: " "

  content:
    type: NONE
    slots:
      - 11
      - 12
      - 14
      - 15
    animation:
      group: 2
      # Buttons refuse to be covered unless they say otherwise. Without
      # this, the loading panes above would skip these slots.
      allow-temporary-items: true
    item:
      material: EMERALD
      name: "&aLoaded"

  featured:
    type: NONE
    slot: 13
    animation:
      group: 2
      delay: 250
      allow-temporary-items: true
    item:
      material: DIAMOND
      name: "&bLoaded last"
      lore:
        - "&7This one has a delay of 250ms,"
        - "&7so it lands after the others."
