# ╔════════════════════════════════════════════════════════════════╗
# ║                   INVENTORY-ANIMATION-ACTION                   ║
# ╚════════════════════════════════════════════════════════════════╝
#
# An animation does not have to be the opening of a menu: the `animation`
# action plays one on the inventory the player is already looking at.
#
#   mode: OVERLAY   only the temporary items play, the buttons are left
#                   alone and keep working. This is the default.
#   mode: REVEAL    the buttons are hidden and revealed again, exactly as
#                   opening the menu does.
#
# An overlay does not freeze the menu, since the player is using it. Add
# `freeze: true` if you want it to.

name: "&8Animation action"
size: 27

items:

  border:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18-21
      - 23-26
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  # The `pulse` animation of the animations folder is made only of
  # temporary items, so it draws over this menu without disturbing it.
  play:
    type: NONE
    slot: 11
    item:
      material: REDSTONE
      name: "&cPlay the pulse"
      lore:
        - "&7Plays `animations/pulse.yml` over this menu."
    actions:
      - type: animation
        file: pulse
        mode: OVERLAY

  # The same animation, played as an opening: the menu hides itself and
  # comes back. `freeze` keeps the player from clicking during it.
  replay:
    type: NONE
    slot: 13
    item:
      material: CLOCK
      name: "&eReplay the opening"
    actions:
      - type: animation
        file: fancy_open
        mode: REVEAL
        freeze: true

  # An animation short enough to not deserve a file of its own can be
  # written inside the action.
  inline:
    type: NONE
    slot: 15
    item:
      material: GLOWSTONE_DUST
      name: "&6Inline animation"
    actions:
      - type: animation
        animation:
          type: SEQUENTIAL
          interval: 40
          freeze: false
          temporary-items:
            sparkle:
              slots:
                - 10-16
              show: start
              hide: 400
              item:
                material: GLOWSTONE
                name: "&e"

  # Stops whatever is playing, applying everything that is left at once.
  stop:
    type: NONE
    slot: 22
    item:
      material: BARRIER
      name: "&cStop the animation"
    actions:
      - type: animation
        stop: true

  # The row the animations draw on. Buttons refuse to be covered unless
  # they say otherwise.
  canvas:
    type: NONE
    slots:
      - 10
      - 12
      - 14
      - 16
    animation:
      allow-temporary-items: true
    item:
      material: WHITE_STAINED_GLASS_PANE
      name: " "
