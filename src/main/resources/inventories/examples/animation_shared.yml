# ╔════════════════════════════════════════════════════════════════╗
# ║                  INVENTORY-SHARED-ANIMATION                    ║
# ╚════════════════════════════════════════════════════════════════╝
#
# Once an animation is more than a few lines it does not belong in every
# menu. Every file in the `animations/` folder can be used by name.
#
# Anything written next to `file` overrides the shared animation key by
# key, not block by block, so this menu can change one value without
# repeating what it belongs to.
#
# See `animations/fancy_open.yml` for the animation this menu uses.

name: "&8Shared animation"
size: 27

open-animation:
  # Several animations may be merged, in the order they are given: here a
  # motion, then an overlay pack that only adds its temporary items.
  # A single one is written `file: fancy_open`.
  files:
    - fancy_open
    - glint

  # Everything below is optional. Remove it and this menu plays those two
  # exactly as their files describe them.
  interval: 15          # faster than the 25 of fancy_open
  groups:
    2:
      delay: 400        # the type, interval and sound of group 2 are untouched

items:

  border:
    type: NONE
    slots:
      - 0-8
      - 9
      - 17
      - 18-26
    animation:
      group: 1
      # `glint` draws its sweep of light across the top row, which this
      # button owns. A shared overlay can only cover buttons that agree
      # to it, so a menu using one has to say so here.
      allow-temporary-items: true
    item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

  content:
    type: NONE
    slots:
      - 11-15
    animation:
      group: 2
    item:
      material: LIME_STAINED_GLASS_PANE
      name: "&aFrom the shared file"
      lore:
        - "&7This menu only writes what it changes:"
        - "&7a faster interval and a longer pause"
        - "&7before this group."
